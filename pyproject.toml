[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dkmio"
version = "0.7.0"
description = "Efficient OKM (Object-Key Mapping) for AWS DynamoDB"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    {name = "Antonio Rodriguez", email = "luis.documentos1706@gmail.com"},
]
readme = "README.md"
keywords = ["dynamodb", "okm", "orm", "aws", "boto3", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["boto3>=1.26.0"]

[project.optional-dependencies]
dev = ["pytest", "moto[dynamodb]", "pytest-cov", "ruff", "mypy"]

[project.urls]
Homepage = "https://dkmio.antoniorodriguez.dev"
Repository = "https://github.com/Antonipo/dkmio"
Issues = "https://github.com/Antonipo/dkmio/issues"
Changelog = "https://github.com/Antonipo/dkmio/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
